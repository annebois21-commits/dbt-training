version: 2

models:
  - name: dim_corpo_employee
    description: Cette table contient des informations sur les employées
   
    
    columns:
      - name: user_id
        description: il s'agit d'un identifiant unique pour chaque employé
        tests: 
          - unique
          - not_null
      - name: first_name
      - name: last_name
      - name: email
      - name: phone_number
      - name: organisation_id
      - name: organisation_name
      - name: pricing_plan
      - name: subsribed_at

  - name: fact_corpo_subscription_income
    description: Cette table contient des informations sur les abonnements des organisations
    
    columns:
      - name: month
      - name: organisation_id
        description: il s'agit d'un identifiant unique pour chaque organisation
       
          
      - name: organisation_name
      - name: income
      - name: pricing_plan

  - name: fact_income_montlhy
    description: Cette table contient des informations sur les revenus par type et par mois
    
    columns:
      - name: month
      - name: product_type
      - name: income

  - name: fact_travel_car_booking
    description: Cette table contient des informations sur les réservations de voitures
    
    columns:
      - name: booking_reference
        description: il s'agit d'un identifiant unique pour chaque réservation
       
          
      - name: booked_at
      - name: start_date
      - name: end_date
      - name: booking_status
      - name: booking_price
      - name: commission_percentage
      - name: organisation_id
      - name: organisation_name
      - name: user_id
      - name: car_rental_company_id
      - name: car_rental_company_name
      - name: car_model_name
      - name: payment_done_at

  - name: fact_travel_hotel_booking
    description: Cette table contient des informations sur les réservations d'hotels
    
    columns:
      - name: booking_reference
        description: il s'agit d'un identifiant unique pour chaque réservation
             
          
    
      - name: booked_at
      - name: start_date
      - name: end_date
      - name: booking_status
      - name: booking_price
      - name: commission_percentage
      - name: organisation_id
      - name: organisation_name
      - name: user_id
      - name: hotel_id
      - name: hotel_name
      - name: hotel_room_id
      - name: payment_done_at    

  - name: fact_travel_income
    description: Cette table contient des informations sur les revenus générés par les organisations
    
    columns:
      - name: day
      - name: product_type
      - name: income
      - name: organisation_id
      - name: organisation_name
           
